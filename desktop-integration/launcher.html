<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>WhatNow</title>
<style>
body{margin:0;padding:10px;background:#0d1014;color:#f4f4ea;font:12px system-ui;border:1px solid #44513a;border-radius:12px}
header{-webkit-app-region:drag;font-weight:800;margin-bottom:8px;cursor:grab;display:flex;justify-content:space-between}
button{cursor:pointer;border:1px solid #44513a;border-radius:7px;padding:5px 8px;background:#182023;color:#f4f4ea}
#open{background:#d8ff74;color:#161b0d;font-weight:750;width:100%;padding:10px;font-size:14px}
small{display:block;color:#abb4b5;margin:6px 0;font-size:10px}
footer{display:flex;justify-content:space-between;gap:4px}
</style>
</head>
<body>
<header><span>✦ WhatNow</span><span aria-label="Drag to move">⠿</span></header>
<button id="open">Nudge me ↗</button>
<small id="state">Click to capture & get help</small>
<footer><button id="edit">Open</button><button id="pause">Pause</button><button id="quit">Quit</button></footer>
</body>
</html>
